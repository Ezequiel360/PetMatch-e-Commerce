<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PetMatch - E-commerce</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.3/font/bootstrap-icons.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&display=swap');

        :root {
            --clr-main: #FF8C00; 
            --clr-main-light: #ffb766;
            --clr-white: #f8f9fa;
            --clr-gray: #e9ecef;
            --clr-red: #ef233c;
            --clr-dark: #2b2d42;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Rubik', sans-serif; }
        body { background-color: var(--clr-main); color: var(--clr-dark); }
        h1, h2, h3, p, button { margin: 0; }
        button { border: none; background: transparent; cursor: pointer; }
        ul { list-style: none; }

        .wrapper { display: grid; grid-template-columns: 1fr 4fr; min-height: 100vh; }

        /* ASIDE */
        aside { padding: 2rem; color: white; position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; justify-content: space-between; }
        .logo { font-size: 1.5rem; font-weight: 700; margin-bottom: 2rem;}
        .menu { display: flex; flex-direction: column; gap: 0.5rem; }
        .boton-menu { color: white; font-size: 1rem; font-weight: 600; padding: 1rem; display: flex; align-items: center; gap: 1rem; width: 100%; border-radius: 1rem; transition: .2s; }
        .boton-menu.active, .boton-menu:hover { background-color: var(--clr-white); color: var(--clr-main); }
        .boton-carrito { margin-top: 2rem; }
        .numerito { background-color: var(--clr-white); color: var(--clr-main); padding: 0.15rem 0.5rem; border-radius: 0.25rem; }
        .boton-carrito.active .numerito { background-color: var(--clr-main); color: var(--clr-white); }

        /* MAIN */
        main { background-color: var(--clr-white); margin: 1rem; margin-left: 0; border-radius: 2rem; padding: 3rem; height: calc(100vh - 2rem); overflow-y: auto; }
        .titulo-principal { margin-bottom: 2rem; color: var(--clr-main); }

        /* PRODUCTOS */
        .contenedor-productos { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 1.5rem; }
        .producto-detalles { background-color: var(--clr-main); color: white; padding: 1rem; border-radius: 1rem; display: flex; flex-direction: column; gap: 0.5rem; }
        
        /* NUEVO CSS: Imagen del producto en la tienda */
        .producto-imagen { width: 100%; height: 200px; object-fit: cover; border-radius: 0.5rem; margin-bottom: 0.5rem; }
        
        .producto-titulo { font-size: 1rem; font-weight: 500; }
        .producto-id { font-size: 0.75rem; background: rgba(0,0,0,0.2); padding: 2px 5px; border-radius: 4px; width: fit-content; }
        .producto-precio { font-size: 1.2rem; font-weight: bold; }
        .producto-agregar { background-color: var(--clr-white); color: var(--clr-main); padding: 0.5rem; border-radius: 0.5rem; text-transform: uppercase; font-weight: 700; transition: .2s; }
        .producto-agregar:hover { background-color: var(--clr-main-light); color: white; }

        /* CARRITO */
        .contenedor-carrito { display: flex; flex-direction: column; gap: 1.5rem; }
        .carrito-vacio, .carrito-comprado { color: var(--clr-main); font-size: 1.2rem; }
        .carrito-productos { display: flex; flex-direction: column; gap: 1rem; }
        .carrito-producto { display: flex; justify-content: space-between; align-items: center; background-color: var(--clr-gray); color: var(--clr-dark); padding: 1rem; border-radius: 1rem; }
        
        /* NUEVO CSS: Alineación de imagen y texto en el carrito */
        .carrito-producto-info-container { display: flex; align-items: center; gap: 1rem; }
        .carrito-producto-imagen { width: 60px; height: 60px; object-fit: cover; border-radius: 0.5rem; }
        
        .carrito-producto small { font-size: 0.75rem; color: #666; }
        .carrito-producto-eliminar { color: var(--clr-red); font-size: 1.2rem; transition: .2s; }
        .carrito-producto-eliminar:hover { transform: scale(1.1); }
        .carrito-acciones { display: flex; justify-content: space-between; align-items: center; }
        .carrito-acciones-vaciar { background-color: var(--clr-gray); padding: 1rem; border-radius: 1rem; color: var(--clr-dark); font-weight: 600; }
        .carrito-acciones-derecha { display: flex; align-items: center; gap: 1rem; }
        .carrito-acciones-total { background-color: var(--clr-gray); padding: 1rem; border-radius: 1rem; font-weight: bold;}
        .carrito-acciones-comprar { background-color: var(--clr-main); color: white; padding: 1rem; border-radius: 1rem; font-weight: 600; }

        .disabled { display: none !important; }
    </style>
</head>
<body>

    <div class="wrapper">
        <aside>
            <header><h1 class="logo">🐾 PetMatch</h1></header>
            <nav>
                <ul class="menu">
                    <li><button id="todos" class="boton-menu boton-categoria active"><i class="bi bi-hand-index-thumb"></i> Todos</button></li>
                    <li><button id="accesorio" class="boton-menu boton-categoria"><i class="bi bi-hand-index-thumb"></i> Accesorios</button></li>
                    <li><button id="alimento" class="boton-menu boton-categoria"><i class="bi bi-hand-index-thumb"></i> Alimentos</button></li>
                    <li><button id="servicio" class="boton-menu boton-categoria"><i class="bi bi-hand-index-thumb"></i> Servicios</button></li>
                    <li>
                        <button id="btn-ir-carrito" class="boton-menu boton-carrito">
                            <i class="bi bi-cart"></i> Carrito <span id="numerito" class="numerito">0</span>
                        </button>
                    </li>
                </ul>
            </nav>
            <footer><p>© 2024 PetMatch</p></footer>
        </aside>

        <main>
            <div id="seccion-tienda">
                <h2 class="titulo-principal" id="titulo-principal">Todos los productos</h2>
                <div id="contenedor-productos" class="contenedor-productos"></div>
            </div>

            <div id="seccion-carrito" class="disabled">
                <h2 class="titulo-principal">Carrito de Compras</h2>
                <div class="contenedor-carrito">
                    <p id="carrito-vacio" class="carrito-vacio">Tu carrito está vacío. <i class="bi bi-emoji-frown"></i></p>
                    <div id="carrito-productos" class="carrito-productos disabled"></div>
                    <div id="carrito-acciones" class="carrito-acciones disabled">
                        <button id="carrito-acciones-vaciar" class="carrito-acciones-vaciar">Vaciar carrito</button>
                        <div class="carrito-acciones-derecha">
                            <div class="carrito-acciones-total">Total: <span id="total">$0</span></div>
                            <button id="carrito-acciones-comprar" class="carrito-acciones-comprar">Comprar ahora</button>
                        </div>
                    </div>
                    <p id="carrito-comprado" class="carrito-comprado disabled">Muchas gracias por tu compra. <i class="bi bi-emoji-laughing"></i></p>
                </div>
            </div>
        </main>
    </div>

    <script>
        // 1. ACTUALIZACIÓN DEL REGISTRO: Se agrega el campo 'imagen'
        // NOTA: Podés cambiar estas URLs por imágenes locales (ej: "img/collar.jpg")
        const productos = [
            {
                id: "PM-1001", nombre: "Collar Reflectante", precio: 15500,
                imagen: "https://placehold.co/400x300/FF8C00/FFF?text=Collar+Reflectante",
                categoria: { nombre: "Accesorios", id: "accesorio" }
            },
            {
                id: "PM-1002", nombre: "Torre Rascador", precio: 45000,
                imagen: "https://placehold.co/400x300/FF8C00/FFF?text=Torre+Rascador",
                categoria: { nombre: "Accesorios", id: "accesorio" }
            },
            {
                id: "PM-1003", nombre: "Adiestramiento (1hr)", precio: 12000,
                imagen: "https://placehold.co/400x300/FF8C00/FFF?text=Adiestramiento",
                categoria: { nombre: "Servicios", id: "servicio" }
            },
            {
                id: "PM-1004", nombre: "Alimento Adulto 3kg", precio: 28000,
                imagen: "https://placehold.co/400x300/FF8C00/FFF?text=Alimento+3kg",
                categoria: { nombre: "Alimentos", id: "alimento" }
            },
            {
                id: "PM-1005", nombre: "Paseo Canino (1hr)", precio: 5000,
                imagen: "https://placehold.co/400x300/FF8C00/FFF?text=Paseo+Canino",
                categoria: { nombre: "Servicios", id: "servicio" }
            }
        ];

        const contenedorProductos = document.getElementById("contenedor-productos");
        const botonesCategorias = document.querySelectorAll(".boton-categoria");
        const tituloPrincipal = document.getElementById("titulo-principal");
        let botonesAgregar = document.querySelectorAll(".producto-agregar");
        const numerito = document.getElementById("numerito");

        const seccionTienda = document.getElementById("seccion-tienda");
        const seccionCarrito = document.getElementById("seccion-carrito");
        const btnIrCarrito = document.getElementById("btn-ir-carrito");

        const contenedorCarritoVacio = document.getElementById("carrito-vacio");
        const contenedorCarritoProductos = document.getElementById("carrito-productos");
        const contenedorCarritoAcciones = document.getElementById("carrito-acciones");
        const contenedorCarritoComprado = document.getElementById("carrito-comprado");
        let botonesEliminar = document.querySelectorAll(".carrito-producto-eliminar");
        const botonVaciar = document.getElementById("carrito-acciones-vaciar");
        const contenedorTotal = document.getElementById("total");
        const botonComprar = document.getElementById("carrito-acciones-comprar");

        // 2. INYECCIÓN DE LA IMAGEN EN LA TIENDA
        function cargarProductos(productosElegidos) {
            contenedorProductos.innerHTML = "";
            productosElegidos.forEach(producto => {
                const div = document.createElement("div");
                div.classList.add("producto-detalles");
                div.innerHTML = `
                    <img src="${producto.imagen}" alt="${producto.nombre}" class="producto-imagen">
                    <span class="producto-id">🔑 ID: ${producto.id}</span>
                    <h3 class="producto-titulo">${producto.nombre}</h3>
                    <p class="producto-precio">$${producto.precio}</p>
                    <button class="producto-agregar" id="${producto.id}">Agregar</button>
                `;
                contenedorProductos.append(div);
            });
            actualizarBotonesAgregar();
        }

        cargarProductos(productos);

        botonesCategorias.forEach(boton => {
            boton.addEventListener("click", (e) => {
                seccionCarrito.classList.add("disabled");
                seccionTienda.classList.remove("disabled");
                btnIrCarrito.classList.remove("active");
                botonesCategorias.forEach(boton => boton.classList.remove("active"));
                e.currentTarget.classList.add("active");

                if (e.currentTarget.id != "todos") {
                    const productoCategoria = productos.find(producto => producto.categoria.id === e.currentTarget.id);
                    tituloPrincipal.innerText = productoCategoria.categoria.nombre;
                    const productosBoton = productos.filter(producto => producto.categoria.id === e.currentTarget.id);
                    cargarProductos(productosBoton);
                } else {
                    tituloPrincipal.innerText = "Todos los productos";
                    cargarProductos(productos);
                }
            });
        });

        let productosEnCarrito = [];
        let productosEnCarritoLS = localStorage.getItem("productos-en-carrito");

        if (productosEnCarritoLS) {
            productosEnCarrito = JSON.parse(productosEnCarritoLS);
            actualizarNumerito();
        } else {
            productosEnCarrito = [];
        }

        function actualizarBotonesAgregar() {
            botonesAgregar = document.querySelectorAll(".producto-agregar");
            botonesAgregar.forEach(boton => {
                boton.addEventListener("click", agregarAlCarrito);
            });
        }

        function agregarAlCarrito(e) {
            const idBoton = e.currentTarget.id;
            const productoAgregado = productos.find(producto => producto.id === idBoton);

            if(productosEnCarrito.some(producto => producto.id === idBoton)) {
                const index = productosEnCarrito.findIndex(producto => producto.id === idBoton);
                productosEnCarrito[index].cantidad++;
            } else {
                productoAgregado.cantidad = 1;
                productosEnCarrito.push(productoAgregado);
            }
            actualizarNumerito();
            localStorage.setItem("productos-en-carrito", JSON.stringify(productosEnCarrito));
        }

        function actualizarNumerito() {
            let nuevoNumerito = productosEnCarrito.reduce((acc, producto) => acc + producto.cantidad, 0);
            numerito.innerText = nuevoNumerito;
        }

        btnIrCarrito.addEventListener("click", () => {
            seccionTienda.classList.add("disabled");
            seccionCarrito.classList.remove("disabled");
            botonesCategorias.forEach(boton => boton.classList.remove("active"));
            btnIrCarrito.classList.add("active");
            cargarProductosCarrito();
        });

        // 3. INYECCIÓN DE LA IMAGEN EN EL CARRITO
        function cargarProductosCarrito() {
            if (productosEnCarrito && productosEnCarrito.length > 0) {
                contenedorCarritoVacio.classList.add("disabled");
                contenedorCarritoProductos.classList.remove("disabled");
                contenedorCarritoAcciones.classList.remove("disabled");
                contenedorCarritoComprado.classList.add("disabled");

                contenedorCarritoProductos.innerHTML = "";

                productosEnCarrito.forEach(producto => {
                    const div = document.createElement("div");
                    div.classList.add("carrito-producto");
                    div.innerHTML = `
                        <div class="carrito-producto-info-container">
                            <img src="${producto.imagen}" alt="${producto.nombre}" class="carrito-producto-imagen">
                            <div class="carrito-producto-titulo">
                                <small>Título</small>
                                <h3>${producto.nombre}</h3>
                            </div>
                        </div>
                        <div class="carrito-producto-cantidad">
                            <small>Cantidad</small>
                            <p>${producto.cantidad}</p>
                        </div>
                        <div class="carrito-producto-precio">
                            <small>Precio</small>
                            <p>$${producto.precio}</p>
                        </div>
                        <div class="carrito-producto-subtotal">
                            <small>Subtotal</small>
                            <p>$${producto.precio * producto.cantidad}</p>
                        </div>
                        <button class="carrito-producto-eliminar" id="${producto.id}"><i class="bi bi-trash-fill"></i></button>
                    `;
                    contenedorCarritoProductos.append(div);
                });
                actualizarBotonesEliminar();
                actualizarTotal();
            } else {
                contenedorCarritoVacio.classList.remove("disabled");
                contenedorCarritoProductos.classList.add("disabled");
                contenedorCarritoAcciones.classList.add("disabled");
                contenedorCarritoComprado.classList.add("disabled");
            }
        }

        function actualizarBotonesEliminar() {
            botonesEliminar = document.querySelectorAll(".carrito-producto-eliminar");
            botonesEliminar.forEach(boton => {
                boton.addEventListener("click", eliminarDelCarrito);
            });
        }

        function eliminarDelCarrito(e) {
            const idBoton = e.currentTarget.id;
            const index = productosEnCarrito.findIndex(producto => producto.id === idBoton);
            productosEnCarrito.splice(index, 1);
            cargarProductosCarrito();
            localStorage.setItem("productos-en-carrito", JSON.stringify(productosEnCarrito));
            actualizarNumerito();
        }

        botonVaciar.addEventListener("click", () => {
            productosEnCarrito.length = 0; 
            localStorage.setItem("productos-en-carrito", JSON.stringify(productosEnCarrito));
            cargarProductosCarrito();
            actualizarNumerito();
        });

        function actualizarTotal() {
            const totalCalculado = productosEnCarrito.reduce((acc, producto) => acc + (producto.precio * producto.cantidad), 0);
            contenedorTotal.innerText = `$${totalCalculado}`;
        }

        botonComprar.addEventListener("click", () => {
            productosEnCarrito.length = 0;
            localStorage.setItem("productos-en-carrito", JSON.stringify(productosEnCarrito));
            contenedorCarritoVacio.classList.add("disabled");
            contenedorCarritoProductos.classList.add("disabled");
            contenedorCarritoAcciones.classList.add("disabled");
            contenedorCarritoComprado.classList.remove("disabled");
            actualizarNumerito();
        });
    </script>
</body>
</html>
